name: Build LABDROID APK (CI/CD)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Dummy Upload Keystore for CI Signing
        run: |
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=LABDROID, OU=Kitchen, O=Labdroid, L=Paris, S=IDF, C=FR"

      - name: Ensure Executable Gradle Wrapper
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          STORE_PASSWORD: "android"
          KEY_PASSWORD: "android"

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          STORE_PASSWORD: "android"
          KEY_PASSWORD: "android"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LABDROID-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LABDROID-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
